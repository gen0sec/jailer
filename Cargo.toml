[workspace]
members = [
    "bpfjailer-common",
    "bpfjailer-bpf",
    "bpfjailer-client",
    "bpfjailer-daemon",
    "bpfjailer-bootstrap",
]
exclude = [
    "test_task_storage",
]
resolver = "2"

# The single source of truth for the release version. Every member inherits it
# via `version.workspace = true`, so `cargo release` bumps one field and the
# `--version` both binaries print can never disagree with the tag.
[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
libbpf-rs = "0.26"
libbpf-sys = "1.4"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
nix = "0.31"
log = "0.4"
env_logger = "0.11"
x509-parser = "0.18"
ring = "0.17"
bytes = "1.11"

[profile.release]
strip = true
lto = true
